#!/usr/bin/env shebang
// строковый комментарий
/* блочный комментарий */

:numbers ( -- ... ) // числовые константы
    -01             // знаковое целое 32 бита
    +02.30          // 32-битный float в точечной записи
    -4e+5           // float в экспоненциальной записи
    0xDeadBeef      // hexadecimal: шестнадцатеричное целое
    0o750           // octal
    0b1101          // binary

:init ( -- ) // определение :слова и комментарий в () для стековых эффектов
    nop      // пустая комманда
    halt     // останов системы

:inc ( n -- n+1 ) // инкремент++
    1 add

:echo ( -- ) // цикл чтения/записи консоли посимвольно
    key ( -- ascii )
    inc
